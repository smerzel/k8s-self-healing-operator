apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunday-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sunday-app
  template:
    metadata:
      labels:
        app: sunday-app
    spec:
      containers:
        - name: server
          image: saramerzel/sunday-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sunday-service
  namespace: default
spec:
  selector:
    app: sunday-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080